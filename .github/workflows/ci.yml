name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Sorties Python en UTF-8 sur tous les runners (la locale par défaut
  # d'ubuntu-latest fait planter les print accentués en ASCII strict).
  PYTHONUTF8: "1"

jobs:
  tests-python:
    name: Noyau Python (fiscal, licence, migration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests unitaires (stdlib uniquement)
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/tests.log

      - name: Diagnostic (si échec)
        if: failure()
        run: |
          echo "Python : $(python -VV)"
          locale 2>/dev/null || true
          # Remonter le traceback dans les annotations (lisibles via API) :
          grep -E "(Traceback|Error|Exception|FAIL|assert)" /tmp/tests.log \
            | head -12 \
            | while IFS= read -r ligne; do echo "::error::$ligne"; done

  tests-dotnet:
    name: Caisse .NET (xUnit)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restorer
        run: dotnet restore Postek.Caisse.Tests/Postek.Caisse.Tests.csproj

      - name: Construire
        run: dotnet build Postek.Caisse.Tests/Postek.Caisse.Tests.csproj --no-restore -c Release --nologo

      - name: Tester
        run: dotnet test Postek.Caisse.Tests/Postek.Caisse.Tests.csproj --no-build -c Release -v minimal

  tests-ecran:
    name: Tests écran UIA (app lancée)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: tests-dotnet
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Construire l'application (Release)
        working-directory: desktop
        run: dotnet build Postek.Caisse/Postek.Caisse.csproj -c Release --nologo

      - name: Pilote UIA (comtypes)
        run: pip install comtypes

      - name: Lancer l'application
        shell: powershell
        run: |
          # PowerShell Start-Process : le processus survit à la fin du pas
          # (un lancement bash le tuerait avec le shell) ; ne PAS utiliser
          # -WindowStyle Hidden, qui masque la fenêtre WPF à UIA.
          $bin = Join-Path (Get-Location) "desktop\Postek.Caisse\bin\Release\net8.0-windows"
          Start-Process -FilePath (Join-Path $bin "Postek.Caisse.exe") -WorkingDirectory $bin
          Start-Sleep -Seconds 6
          if (-not (Get-Process -Name Postek.Caisse -ErrorAction SilentlyContinue)) {
            throw "L'application POSTEK ne s'est pas lancée"
          }

      - name: Tests écran (F2, mixte, raccourcis clavier paiement)
        run: |
          python tools/test_f2_ui.py
          python tools/test_mix_ui.py
          python tools/test_clavier_ui.py
          python tools/test_admin_ui.py

      - name: Diagnostic en cas d'échec
        if: failure()
        shell: powershell
        run: |
          Get-Process -Name Postek.Caisse -ErrorAction SilentlyContinue |
            Format-List Id, MainWindowTitle, Responding
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens |
            ForEach-Object { "Écran : $($_.Bounds)" }

      - name: Artefacts de diagnostic (flux imprimante, base démo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-tests-ecran
          path: |
            desktop/Postek.Caisse/bin/Release/net8.0-windows/imprimante.logique
            desktop/Postek.Caisse/bin/Release/net8.0-windows/postek_demo.db
          if-no-files-found: ignore
          retention-days: 7

      - name: Arrêter l'application
        if: always()
        shell: powershell
        run: Stop-Process -Name Postek.Caisse -Force -ErrorAction SilentlyContinue

  rebranding:
    name: Garde-fou rebranding (aucun texte Atoo/Leo2 dans POSTEK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le code de l'application POSTEK
        shell: bash
        run: |
          # L'app POSTEK (desktop) ne doit contenir aucune référence à
          # l'application d'origine — exigence cahier des charges §3.6.
          # (Les mentions dans docs/, migration/… documentent la migration
          # depuis l'existant et sont volontairement exclues.)
          if grep -RniE 'atoo|leo2' desktop/Postek.Caisse \
               --include='*.cs' --include='*.xaml' --include='*.json' \
               -l | grep -v '/obj/' | grep -v '/bin/'; then
            echo "::error::Références Atoo/Leo2 détectées dans le code POSTEK (voir liste ci-dessus)"
            exit 1
          fi
          echo "OK : aucun texte Atoo/Leo2 dans l'application POSTEK"
